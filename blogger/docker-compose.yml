# Run the whole stack with: docker compose up --build   then open http://localhost:5000
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/blogify
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      JWT_EXPIRATION: 1h
      PORT: 5000
      COOKIE_SECURE: "false" # plain http on localhost; set to "true" behind HTTPS
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
